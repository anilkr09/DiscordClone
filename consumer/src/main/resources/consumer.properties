spring.application.name=message-consumer
spring.config.import=optional:file:.env[.properties]

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=message-persistence-group
# Replay is safe because the insert is idempotent, so a new group starts from the beginning.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.discordclone.contract.MessageCreatedV1
spring.kafka.consumer.properties.spring.json.trusted.packages=com.discordclone.contract
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=2
spring.kafka.producer.acks=all

# Database: the application owns the schema; this service only inserts.
spring.datasource.url=jdbc:postgresql://localhost:5432/dev_database
spring.datasource.username=dev_user
spring.datasource.password=${DB_PASSWORD}
# Fail rather than hang when the database stops answering, so the record is retried.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=10

# Operations
server.port=${CONSUMER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,listeners
