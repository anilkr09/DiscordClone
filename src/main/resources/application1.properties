########################################



# Application
########################################
spring.application.name=discord-clone
server.port=8080


########################################
# Database - PostgreSQL (JPA + Hibernate)
########################################
spring.datasource.url=jdbc:postgresql://localhost:5432/dev_database
spring.datasource.username=dev_user
spring.datasource.password=dev_password

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


########################################
# Connection Pool (HikariCP)
########################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DiscordHikariCP


########################################
# Security & JWT
########################################
# JWT secret should be overridden via ENV in prod
security.jwt.secret=change-this-secret
security.jwt.expiration-ms=86400000
security.jwt.refresh-expiration-ms=604800000


########################################
# WebSocket Configuration
########################################
spring.websocket.message-broker.enabled=true


########################################
# Redis Configuration
########################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000


########################################
# Kafka Configuration
########################################
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=discord-clone-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


########################################
# Validation
########################################
spring.mvc.problemdetails.enabled=true


########################################
# Logging
########################################
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


########################################
# Actuator (optional but recommended)
########################################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


########################################
# Jackson (JSON)
########################################
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC


########################################
# File Upload (if needed later)
########################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


########################################
# Test Profile Override Hint
########################################
# Use application-test.properties for tests
# spring.profiles.active=test
