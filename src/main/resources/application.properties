########################################


# Default profile
spring.profiles.active=local

# Secrets come from the environment. For local runs, copy .env.example to .env;
# Spring Boot loads it from the working directory, and so does docker compose.
spring.config.import=optional:file:.env[.properties]


# -------------------------------
# DATASOURCE (example - update)
# -------------------------------
    spring.datasource.url=jdbc:postgresql://localhost:5432/dev_database
spring.datasource.username=dev_user
spring.datasource.password=${DB_PASSWORD}


########################################
# JPA / Hibernate
########################################
# The schema belongs to the Flyway migrations in db/migration; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# A database created before migrations existed is marked as V1 and migrated from there.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

########################################
# Application
########################################
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.seed.enabled=false
app.seed.password=${SEED_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

########################################
# Server Configuration
########################################
server.port=8080

########################################
# Logging Configuration
########################################
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.discordclone=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

########################################
# JWT Configuration
########################################
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

########################################
# Redis Configuration
########################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.password=${REDIS_PASSWORD:}

