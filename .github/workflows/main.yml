
name: Git Repository Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize backup variables
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          DATE=$(date -u +%Y%m%d_%H%M%S)

          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Clone repository as mirror
        run: |
          git clone --mirror \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${REPO_NAME}.git"

      - name: Compress repository
        run: |
          ARCHIVE="${REPO_NAME}-backup-${DATE}.tar.gz"

          tar -czf "$ARCHIVE" "${REPO_NAME}.git"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify compressed backup
        run: |
          tar -tzf "$ARCHIVE" > /dev/null
          echo "Backup verification successful"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-backup-${{ env.DATE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -rf "${REPO_NAME}.git"
          echo "Temporary backup directory cleaned up"
