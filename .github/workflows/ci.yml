name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir . --redact --no-banner

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start PostgreSQL and Redis with throwaway secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 64)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "PGADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose up -d --wait db redis
      - name: Start the application
        run: |
          ./gradlew :bootJar
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          timeout 90 sh -c 'until curl -sf localhost:8080/readyz; do sleep 2; done'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Show the application log
        if: failure()
        run: tail -200 app.log

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: backend, context: ., file: Dockerfile}
          - {name: consumer, context: ., file: consumer/Dockerfile}
          - {name: frontend, context: frontend, file: frontend/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t discordclone/${{ matrix.name }}:ci -f ${{ matrix.file }} ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: discordclone/${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
