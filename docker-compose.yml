
services:
  # ---------------------------
  # 🐘 PostgreSQL
  # ---------------------------
  db:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: dev_database
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------
  # 🌐 pgAdmin
  # ---------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dev.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------
  # ⚡ Redis
  # ---------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_dev
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------------------------
  # 📡 Kafka
  # ---------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      # --- Kafka environment additions ---
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # 🔥 Dual listeners (IMPORTANT)
      # --- Modified listeners ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # One list item, so that the shell receives the whole script as a single argument.
    command:
      - >-
        for topic in message-events message-events-dlt; do
        kafka-topics --create --if-not-exists --topic $$topic
        --bootstrap-server kafka:29092 --partitions 4 --replication-factor 1 || exit 1;
        done
  # ---------------------------
  # Application (docker compose --profile app up -d --build)
  # Web client on http://localhost:3000, API on http://localhost:8080
  # ---------------------------
  backend:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dev_database
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:*}
      # The page is served over plain HTTP here, on the same site as the API.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  lb:
    profiles: ["app"]
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./ops/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      lb:
        condition: service_healthy

  # ---------------------------
  # Message consumer (docker compose --profile kafka up -d)
  # ---------------------------
  # Start order: db and kafka healthy, topics created, then this. The tables come from the
  # application's migrations, so start the application before sending messages.
  consumer:
    profiles: ["kafka"]
    build:
      context: .
      dockerfile: consumer/Dockerfile
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dev_database
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------
  # 📊 Kafka UI
  # ---------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

# ---------------------------
# 📦 Volumes
# ---------------------------
volumes:
  pgdata:
  redis-data:
  kafka-data: