plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
//	id 'checkstyle'
	id 'pmd'
	id "org.sonarqube" version "6.0.1.5171"


}

group = 'com.discordclone'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	sourceCompatibility = JavaVersion.VERSION_17

}

sonar {
	properties {
		property "sonar.projectKey", "discord-clone"
		property "sonar.organization", "anilkr09"
		property "sonar.host.url", "https://sonarcloud.io"
	}
}


// Needed to talk to current Docker engines; also used by the consumer module.
ext['testcontainers.version'] = '1.21.4'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation project(':contract')
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.14'

	implementation 'org.springframework.security:spring-security-messaging'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// JWT Dependencies
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

test {
	useJUnitPlatform()
	// -PupdateOpenApi rewrites frontend/openapi.json from the running API.
	if (project.hasProperty('updateOpenApi')) {
		systemProperty 'updateOpenApi', 'true'
		outputs.upToDateWhen { false }
	}
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
//checkstyle {
//	toolVersion = '10.12.1'
//	ignoreFailures = false
//	showViolations = true
//
//
//	configDirectory = file("${rootDir}/config/checkstyle")

//}

pmd {
	toolVersion = '6.55.0'
	ruleSets = [] // empty to allow custom ruleSet file
	ruleSetFiles = files("${rootDir}/config/pmd/pmd-ruleset.xml")
	ignoreFailures = true
}

//tasks.withType(Checkstyle) {
//	reports {
//		xml.required = false
//		html.required = true
//	}
//}

tasks.withType(Pmd) {
	reports {
		xml.required = false
		html.required = true
	}
}

check.dependsOn  pmdMain, pmdTest

//check.dependsOn checkstyleMain, checkstyleTest, pmdMain, pmdTest

jar {
	enabled = false
}

bootJar {
	archiveBaseName = 'discord-clone'
	archiveVersion = '0.0.1-SNAPSHOT'
	mainClass = 'com.discordclone.DiscordCloneApplication'
}
